name: Publish Debian package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/release-deb.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set package version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            revision="${GITHUB_REF_NAME##*-}"
            if [[ ! "$revision" =~ ^[1-9][0-9]*$ || "$GITHUB_REF_NAME" != "v${version}-${revision}" ]]; then
              echo "Tag must match v${version}-<positive Debian revision>" >&2
              exit 1
            fi
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "revision=1" >> "$GITHUB_OUTPUT"
            echo "snapshot_run=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release_tag=main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --wheel --outdir dist
          python scripts/check-wheel.py dist/win_dot_panel-*.whl
      - name: Build Debian package
        run: |
          args=(--revision "${{ steps.version.outputs.revision }}")
          if [[ -n "${{ steps.version.outputs.snapshot_run }}" ]]; then
            args+=(--snapshot-run "${{ steps.version.outputs.snapshot_run }}")
          fi
          python scripts/build_deb.py dist/win_dot_panel-*.whl "${args[@]}"
          cd dist
          sha256sum win-dot-panel_*.deb > SHA256SUMS
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
      - name: Publish main prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Main build #${GITHUB_RUN_NUMBER}" \
            --notes "Development build from main commit ${GITHUB_SHA}." \
            --repo "$GITHUB_REPOSITORY"
