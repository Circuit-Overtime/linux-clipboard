name: Check and publish Debian package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'web/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    uses: ./.github/workflows/checks.yml

  package:
    name: Build and validate package
    needs: checks
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish validated package
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: validated-debian-package
          path: dist
      - name: Verify downloaded package
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.package.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
      - name: Publish main prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.package.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Main build #${GITHUB_RUN_NUMBER}" \
            --notes "Development build from main commit ${GITHUB_SHA}." \
            --repo "$GITHUB_REPOSITORY"

  pages:
    name: Publish package site and APT repository
    needs: [package, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: validated-debian-package
          path: dist
      - name: Verify downloaded package
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Prepare product page
        run: mkdir -p site && cp -R web/. site/
      - name: Download latest stable package for main builds
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -n "$stable_tag" ]]; then
            mkdir -p stable-dist
            gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" \
              -p 'win-dot-panel_*_all.deb' -D stable-dist
          fi
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg
      - name: Build signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [[ -z "$APT_SIGNING_KEY" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo 'APT_SIGNING_KEY is required for stable releases' >&2
              exit 1
            fi
            echo 'Signing key not configured; deploying product page only'
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package=(dist/win-dot-panel_*.deb)
          else
            package=(stable-dist/win-dot-panel_*.deb)
            if [[ ! -f "${package[0]}" ]]; then
              echo 'No stable release is available; deploying product page only'
              exit 0
            fi
          fi
          export GNUPGHOME="$RUNNER_TEMP/win-dot-panel-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          bash scripts/build_apt_repo.sh "${package[0]}" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
