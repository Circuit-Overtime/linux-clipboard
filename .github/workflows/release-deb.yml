name: Check and publish Debian package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'web/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    uses: ./.github/workflows/checks.yml

  package:
    name: Build and validate package
    needs: checks
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish validated package
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: validated-debian-package
          path: dist
      - name: Verify downloaded package
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo 'APT_SIGNING_KEY is required for stable releases' >&2; exit 1; }
          if gh release view "${{ needs.package.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${{ needs.package.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${{ needs.package.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
              --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish main prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.package.outputs.release_tag }}" dist/win-dot-panel_*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Main build #${GITHUB_RUN_NUMBER}" \
            --notes "Development build from main commit ${GITHUB_SHA}." \
            --repo "$GITHUB_REPOSITORY"

  pages:
    name: Publish package site and APT repository
    needs: [package, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: validated-debian-package
          path: dist
      - name: Verify downloaded package
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Prepare product page
        run: mkdir -p site && cp -R web/. site/
      - name: Check APT signing configuration
        id: signing
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [[ -n "$APT_SIGNING_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo 'APT_SIGNING_KEY is required for stable releases' >&2
            exit 1
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download latest stable package for main builds
        if: github.ref_type == 'branch' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p stable-dist
          gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" \
            -p 'win-dot-panel_*_all.deb' -p 'SHA256SUMS' -D stable-dist
          (cd stable-dist && sha256sum -c SHA256SUMS)
      - name: Install repository tools
        if: steps.signing.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg
      - name: Build signed repository
        if: steps.signing.outputs.enabled == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package=(dist/win-dot-panel_*.deb)
          else
            package=(stable-dist/win-dot-panel_*.deb)
          fi
          test -f "${package[0]}"
          export GNUPGHOME="$RUNNER_TEMP/win-dot-panel-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          bash scripts/build_apt_repo.sh "${package[0]}" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
