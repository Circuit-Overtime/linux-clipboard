name: Release Debian package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build package
        run: |
          version="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' screenbridge/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME"
          ./packaging/build-deb.sh

      - name: Prepare stable download
        run: |
          cp dist/screenbridge_*_all.deb dist/screenbridge_all.deb
          cd dist
          sha256sum screenbridge_all.deb > screenbridge_all.deb.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.deb dist/*.sha256
          --verify-tag
          --generate-notes
          --title "ScreenBridge ${GITHUB_REF_NAME#v}"
